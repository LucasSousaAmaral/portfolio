name: PR Checks
on:
  pull_request:
    branches: [ main ]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'infra/**'
      - '.github/workflows/ci-pr-checks.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: 'npm', cache-dependency-path: 'frontend/package-lock.json' }
      - name: Build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
        run: |
          npm ci
          npm run build

  backend:
    name: Backend Build (dotnet 8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - name: Restore & Build
        working-directory: backend/Portfolio.Api
        run: |
          dotnet restore
          dotnet build -c Release --nologo
      - name: Test (se existir projeto de teste)
        run: |
          if ls **/*Tests.csproj >/dev/null 2>&1; then
            for p in $(ls **/*Tests.csproj); do dotnet test "$p" -c Release --no-build; done
          else
            echo "Sem testes no repo (ok por enquanto)."
          fi

  tf-plan:
    name: Terraform fmt/validate/plan
    runs-on: ubuntu-latest
    permissions: { id-token: write, contents: read }
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: 1.8.5 }
      - name: Fmt & Validate
        working-directory: infra/envs/dev
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false
          terraform validate
      - name: Plan (no backend)
        working-directory: infra/envs/dev
        run: |
          terraform plan -input=false -lock=false -out=tfplan
          terraform show -no-color tfplan > plan.txt
      - uses: actions/upload-artifact@v4
        with:
          name: tfplan-dev
          path: infra/envs/dev/plan.txt
