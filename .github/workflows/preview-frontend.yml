name: Preview Frontend (PR)
on:
  pull_request:
    branches: [ main ]
    paths:
      - 'frontend/**'
      - '.github/workflows/preview-frontend.yml'

concurrency:
  group: preview-front-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    permissions: { id-token: write, contents: read, pull-requests: write }
    environment: dev
    env:
      PR_NUM: ${{ github.event.pull_request.number }}
      BASE_PATH: /previews/pr-${{ github.event.pull_request.number }}
      ASSET_PREFIX: /previews/pr-${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: 'npm', cache-dependency-path: 'frontend/package-lock.json' }

      - name: Build estático (com basePath de preview)
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
          BASE_PATH: ${{ env.BASE_PATH }}
          ASSET_PREFIX: ${{ env.ASSET_PREFIX }}
        run: |
          npm ci
          npm run build
          npm run export

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Sync para prefixo do preview
        run: aws s3 sync frontend/out s3://${{ vars.S3_BUCKET }}${{ env.BASE_PATH }} --delete

      - name: Invalidate somente o preview
        run: aws cloudfront create-invalidation --distribution-id ${{ vars.CF_DISTR_ID }} --paths "${{ env.BASE_PATH }}/*"

      - name: Descobrir domínio do CloudFront (fallback se CF_DOMAIN não estiver definido)
        id: cf
        run: |
          if [ -n "${{ vars.CF_DOMAIN }}" ]; then
            echo "domain=${{ vars.CF_DOMAIN }}" >> $GITHUB_OUTPUT
          else
            # tenta obter do AWS pela distribution id
            DOMAIN=$(aws cloudfront list-distributions --query "DistributionList.Items[?Id=='${{ vars.CF_DISTR_ID }}'].DomainName | [0]" --output text)
            echo "domain=https://${DOMAIN}" >> $GITHUB_OUTPUT
          fi

      - name: Comentar URL no PR
        uses: actions/github-script@v7
        with:
          script: |
            const url = `${{ steps.cf.outputs.domain }}${process.env.BASE_PATH}/`;
            const body = `🚀 **Preview atualizado**: ${url}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

  cleanup:
    if: ${{ github.event.action == 'closed' || github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest
    permissions: { id-token: write, contents: read }
    environment: dev
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Apagar prefixo do preview ao fechar PR
        run: |
          aws s3 rm s3://${{ vars.S3_BUCKET }}/previews/pr-${{ github.event.pull_request.number }}/ --recursive || true
