name: Frontend Deploy (main)
on:
  push:
    branches: [ main ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-deploy.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions: { id-token: write, contents: read }
    environment: portfolio-env
    steps:
      - uses: actions/checkout@v4

      # Setup Node COM cache se existir package-lock.json
      - name: Setup Node (cached)
        if: ${{ hashFiles('frontend/package-lock.json') != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Setup Node SEM cache (fallback)
      - name: Setup Node (no cache)
        if: ${{ hashFiles('frontend/package-lock.json') == '' }}
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Echo envs (debug)
        run: echo "API=${{ vars.NEXT_PUBLIC_API_BASE_URL }}"

      - name: Build estático (root)
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi
          npm run build

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Sync para S3 (root) + invalidation global
        run: |
          aws s3 sync frontend/out s3://${{ vars.S3_BUCKET }} --delete
          aws cloudfront create-invalidation --distribution-id ${{ vars.CF_DISTR_ID }} --paths "/*"
